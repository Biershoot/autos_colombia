{% extends "base.html" %}
{% block title %}Editar Usuario - Autos Colombia{% endblock %}
{% block page_title %}Editar Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header py-3 px-4"><i class="bi bi-pencil me-2"></i>Editar {{ user.full_name }}</div>
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre Completo</label>
              <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Teléfono</label>
              <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Correo</label>
              <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="col-12">
              <label class="form-label">Dirección</label>
              <input type="text" name="address" class="form-control" value="{{ user.address or '' }}">
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="bi bi-check-lg me-1"></i>Guardar Cambios
            </button>
            <a href="{{ url_for('users.detail', user_id=user.id) }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
