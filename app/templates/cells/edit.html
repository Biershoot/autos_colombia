{% extends "base.html" %}
{% block title %}Editar Celda {{ cell.number }} - Autos Colombia{% endblock %}
{% block page_title %}Editar Celda {{ cell.number }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header py-3 px-4"><i class="bi bi-pencil me-2"></i>Celda {{ cell.number }}</div>
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo</label>
              <select name="cell_type" class="form-select" required>
                <option value="car"        {% if cell.cell_type=='car'        %}selected{% endif %}>🚗 Carro</option>
                <option value="motorcycle" {% if cell.cell_type=='motorcycle' %}selected{% endif %}>🏍️ Motocicleta</option>
                <option value="truck"      {% if cell.cell_type=='truck'      %}selected{% endif %}>🚛 Camión</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Piso</label>
              <select name="floor" class="form-select">
                {% for f in [1,2,3] %}
                <option value="{{ f }}" {% if cell.floor == f %}selected{% endif %}>Piso {{ f }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Tarifa Mensual (COP)</label>
              <input type="number" name="monthly_fee" class="form-control" value="{{ cell.monthly_fee }}" required>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
            <a href="{{ url_for('cells.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
