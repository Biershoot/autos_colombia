{% extends "base.html" %}
{% block title %}Nueva Celda - Autos Colombia{% endblock %}
{% block page_title %}Crear Celda{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header py-3 px-4"><i class="bi bi-grid-3x3 me-2"></i>Nueva Celda</div>
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Número <span class="text-danger">*</span></label>
              <input type="text" name="number" class="form-control text-uppercase" required placeholder="Ej: 1001">
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select name="cell_type" class="form-select" required>
                <option value="">Seleccionar...</option>
                <option value="car">🚗 Carro</option>
                <option value="motorcycle">🏍️ Motocicleta</option>
                <option value="truck">🚛 Camión</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Piso <span class="text-danger">*</span></label>
              <select name="floor" class="form-select" required>
                <option value="1">Piso 1</option>
                <option value="2">Piso 2</option>
                <option value="3">Piso 3</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tarifa Mensual (COP) <span class="text-danger">*</span></label>
              <input type="number" name="monthly_fee" class="form-control" required
                     placeholder="Ej: 150000" min="0" step="1000">
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="bi bi-check-lg me-1"></i>Crear Celda
            </button>
            <a href="{{ url_for('cells.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
